name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build (Frontend)
        run: |
          if [ -d "MELHORIA DE DESCRICAO" ]; then
            cd "MELHORIA DE DESCRICAO"
          fi
          npm install
          npm run build

      - name: Deploy Files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/var/www/melhoria-ia"
          rm: false

      - name: Execute Remote SSH Commands (Restart PM2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ -d "/var/www/melhoria-ia/MELHORIA DE DESCRICAO" ]; then
              cd "/var/www/melhoria-ia/MELHORIA DE DESCRICAO"
            else
              cd "/var/www/melhoria-ia"
            fi
            
            # Instala dependências do backend se package.json existir
            if [ -f "package.json" ]; then
              npm install --production
            fi
            
            # Reinicia o backend pelo PM2
            pm2 restart melhoria-ia || pm2 start server/index.js --name melhoria-ia
